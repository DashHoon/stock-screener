# 일별 배치: 수집 → 지표 계산 → JSON 산출 → 데이터 커밋 → Vercel 재배포
#
# 사전 준비 (GitHub Secrets):
#   DATA_GO_KR_API_KEY     — 공공데이터포털 인증키 (없으면 fdr 폴백으로도 동작)
#   VERCEL_DEPLOY_HOOK_URL — Vercel 프로젝트의 Deploy Hook (Phase 3에서 등록)
#
# 데이터 커밋 전략: 산출 JSON(web/public/data)은 매일 덮어쓰며 data 브랜치에
# force-push 한다 (main 이력 오염 방지). Vercel은 data 브랜치를 배포 대상으로 연결.
# ※ ohlcv 캐시(batch/data/cache)는 Actions cache에 보관해 매일 증분 수집만 한다.

name: daily-batch

on:
  schedule:
    - cron: "0 13 * * 1-5"  # KST 22:00 (UTC 13:00) 평일
    - cron: "0 0 * * 2-6"   # KST 09:00 익일 오전 재시도
    - cron: "0 16 * * 5"    # KST 토 01:00 — 전 종목 재백필 (수정주가 정합성 보정)
  workflow_dispatch:
    inputs:
      rebuild:
        description: "전 종목 캐시 재수집 (수정주가 보정)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 평시 ~5분. 전체 재백필(병렬)도 ~15분이지만 여유를 둔다
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Restore OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: batch/data/cache
          # 10y 접두어: 2년→10년 전환 시 구 캐시를 버리고 전체 재수집하도록 키를 올림
          key: ohlcv-cache-10y-${{ github.run_id }}
          restore-keys: ohlcv-cache-10y-

      - name: Install dependencies
        run: uv sync  # setuptools<81 포함 (pyproject 의존성으로 관리)

      - name: Run batch
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          if [[ "${{ github.event.schedule }}" == "0 16 * * 5" || "${{ inputs.rebuild }}" == "true" ]]; then
            uv run python -m batch.run --rebuild-all
          else
            uv run python -m batch.run
          fi

      # 이후 단계가 실패해도 백필 결과는 보존한다 (기본 cache 액션은 잡 실패 시 저장 안 함)
      - name: Save OHLCV cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: batch/data/cache
          key: ohlcv-cache-10y-${{ github.run_id }}

      - name: Check output freshness
        id: fresh
        run: |
          DATE=$(python -c "import json;print(json.load(open('web/public/data/signals/latest.json'))['date'])")
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          # 최근 5일 안의 데이터가 아니면 배포 스킵 (휴장 연휴 감안)
          LIMIT=$(date -d '5 days ago' +%F)
          if [[ "$DATE" < "$LIMIT" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push data branch
        if: steps.fresh.outputs.stale == 'false'
        run: |
          git config user.name "batch-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B data
          # GITHUB_TOKEN은 워크플로 파일이 든 새 브랜치를 만들 수 없다 →
          # data 브랜치에서는 .github를 제거 (Vercel 빌드에 불필요)
          rm -rf .github
          git add -A
          git add -f web/public/data
          git commit -m "data: ${{ steps.fresh.outputs.date }}" || exit 0
          git push -f origin data

      # Vercel이 data 브랜치 push를 감지해 자동 배포하므로 Hook은 선택사항.
      # (자동 배포를 껐거나 별도 트리거가 필요할 때만 Secret 등록)
      - name: Trigger Vercel deploy (optional)
        if: steps.fresh.outputs.stale == 'false'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [[ -n "$HOOK" ]]; then
            curl -fsS -X POST "$HOOK" > /dev/null
          else
            echo "Deploy Hook 미설정 — Vercel 자동 배포에 위임"
          fi
