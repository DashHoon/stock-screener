# 일별 배치: 수집 → 지표 계산 → JSON 산출 → 데이터 커밋 → Vercel 재배포
#
# 사전 준비 (GitHub Secrets):
#   DATA_GO_KR_API_KEY     — 공공데이터포털 인증키 (없으면 fdr 폴백으로도 동작)
#   ECOS_API_KEY           — 한국은행 ECOS 인증키 (없으면 국내 매크로 계열만 빠짐)
#   VERCEL_DEPLOY_HOOK_URL — Vercel 프로젝트의 Deploy Hook (Phase 3에서 등록)
#
# 데이터 커밋 전략: 산출 JSON(web/public/data)은 매일 덮어쓰며 data 브랜치에
# force-push 한다 (main 이력 오염 방지). Vercel은 data 브랜치를 배포 대상으로 연결.
# ※ ohlcv 캐시(batch/data/cache)는 Actions cache에 보관해 매일 증분 수집만 한다.

name: daily-batch

on:
  schedule:
    # 정각 크론은 GitHub에서 지연·누락이 잦아 어중간한 분으로 설정한다.
    # 공공데이터포털 자료는 보통 다음 날 올라오지만 주말에는 더 늦을 수 있다.
    # 실제로 2026-09-11(금) 자료가 토요일 재시도 때까지 없었고, 기존 스케줄은
    # 일요일에 돌지 않아 월요일까지 회수하지 못했다. 따라서 휴일을 포함해 매일
    # 실행한다. 09:13은 밤사이 올라온 자료를 회수하는 보정 슬롯이고,
    # 14:13 이후 슬롯은 앞 실행이 실패하거나 공급처 갱신이 늦을 때의 재시도다.
    # 앞 슬롯이 성공했으면 아래 freshness 검사에서 같은 기준일의 배포를 건너뛰므로
    # Vercel 빌드와 Deployment Storage는 추가로 소비하지 않는다.
    - cron: "13 0,5,6,7,9,12 * * *"  # KST 09:13, 14:13, 15:13, 16:13, 18:13, 21:13
    - cron: "11 16 * * 5"    # KST 토 01:11 — 전 종목 재백필 (수정주가 정합성 보정)
  workflow_dispatch:
    inputs:
      rebuild:
        description: "전 종목 캐시 재수집 (수정주가 보정)"
        type: boolean
        default: false
      force_publish:
        description: "같은 기준일에도 재계산한 데이터 배포 (로직 변경 반영)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 평시 ~5분. 전체 재백필(병렬)도 ~15분이지만 여유를 둔다
    env:
      # 워밍업 슬롯은 2026-08-06에 없앴다 (네이버 수집을 일별 경로에서 뺌).
      # 조건식은 남겨 둔다 — 아래 단계들이 이 값을 참조하고, 나중에 수집 전용
      # 슬롯이 다시 필요해지면 여기만 고치면 된다.
      IS_WARMUP: false
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Restore OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: batch/data/cache
          # 10y 접두어: 2년→10년 전환 시 구 캐시를 버리고 전체 재수집하도록 키를 올림
          key: ohlcv-cache-10y-${{ github.run_id }}
          restore-keys: ohlcv-cache-10y-

      - name: Install dependencies
        run: uv sync  # setuptools<81 포함 (pyproject 의존성으로 관리)

      - name: Run batch
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          if [[ "$IS_WARMUP" == "true" ]]; then
            echo "워밍업 슬롯: 시세 수집만 (계산·배포 없음)"
            uv run python -m batch.run --collect-only
            exit 0
          fi
          if [[ "${{ github.event.schedule }}" == "11 16 * * 5" || "${{ inputs.rebuild }}" == "true" ]]; then
            uv run python -m batch.run --rebuild-all
          else
            uv run python -m batch.run
          fi
          # 매크로 지표(금리·물가·경기·달러). FRED는 미 연준 공개 데이터라
          # 키가 필요 없고, 국내 계열만 ECOS_API_KEY를 쓴다. 여기서 실패해도
          # 나머지 산출물은 그대로 나가야 하므로 실패를 삼킨다 — 그 화면만 옛 값을
          # 보여준다.
          uv run python -m batch.macro || echo "매크로 수집 실패 — 이전 값 유지"
          # 공개 /stats 요약 통계만 생성한다. 사용자 정의 클라이언트 데이터셋은
          # 배포 저장소를 크게 차지해 중단했다.
          uv run python -m batch.backtest.run

      # 이후 단계가 실패해도 백필 결과는 보존한다 (기본 cache 액션은 잡 실패 시 저장 안 함)
      - name: Save OHLCV cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: batch/data/cache
          key: ohlcv-cache-10y-${{ github.run_id }}

      - name: Check output freshness
        id: fresh
        if: env.IS_WARMUP != 'true'
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          DATE=$(python -c "import json;print(json.load(open('web/public/data/signals/latest.json'))['date'])")
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          # 최근 5일 안의 데이터가 아니면 배포 스킵 (휴장 연휴 감안)
          LIMIT=$(date -d '5 days ago' +%F)
          if [[ "$DATE" < "$LIMIT" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
          # 이미 배포된 것과 같은 기준일이면 배포하지 않는다. 슬롯을 여러 개 두면
          # 앞 슬롯이 성공한 날 뒤 슬롯이 같은 데이터를 다시 올려 Vercel 빌드만
          # 낭비한다. data 브랜치의 마지막 커밋 메시지에 기준일이 들어 있다.
          # checkout은 main만 얕게 받아오므로 data 브랜치를 따로 가져온다.
          git fetch --depth=1 origin data 2>/dev/null || true
          LIVE=$(git log FETCH_HEAD -1 --format=%s 2>/dev/null | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          if [[ "$DATE" == "$LIVE" && "$FORCE_PUBLISH" != "true" ]]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "이미 $DATE 로 배포돼 있음 — 배포 건너뜀"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push data branch
        if: env.IS_WARMUP != 'true' && steps.fresh.outputs.stale == 'false' && steps.fresh.outputs.same == 'false'
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path("web/public/data/deployment.json").write_text(json.dumps({
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
          }, separators=(",", ":")))
          PY
          git config user.name "batch-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B data
          # GITHUB_TOKEN은 워크플로 파일이 든 새 브랜치를 만들 수 없다 →
          # data 브랜치에서는 .github를 제거 (Vercel 빌드에 불필요)
          rm -rf .github
          git add -A
          git add -f web/public/data
          git commit -m "data: ${{ steps.fresh.outputs.date }}" || exit 0
          git push -f origin data

      # Vercel이 data 브랜치 push를 감지해 자동 배포하므로 Hook은 선택사항.
      # (자동 배포를 껐거나 별도 트리거가 필요할 때만 Secret 등록)
      - name: Trigger Vercel deploy (optional)
        if: env.IS_WARMUP != 'true' && steps.fresh.outputs.stale == 'false' && steps.fresh.outputs.same == 'false'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [[ -n "$HOOK" ]]; then
            curl -fsS -X POST "$HOOK" > /dev/null
          else
            echo "Deploy Hook 미설정 — Vercel 자동 배포에 위임"
          fi
